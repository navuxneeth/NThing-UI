X=200
Y=140
Shape=Rectangle 0,0,80,30,10 | Fill Color #DarkSecondaryColor# | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables GlobalScale "1.25" "#@#GlobalVariables.inc"][!RefreshGroup "NThingUI"]

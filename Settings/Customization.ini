[Metadata]
Author=Sahil / MaybeSahil / Runixe786
Name=Global Customization Settings
Description=Adjust colors and scale for all NThing UI widgets
Tags=settings,customization,colors,scale,resolution

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=1B1C1D

[Variables]
@Include=#@#GlobalVariables.inc
InputWidth=100
InputHeight=20

; ==========================================
; BACKGROUND
; ==========================================

[Background]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,320,580,15 | Fill Color #DarkBgColor# | StrokeWidth 0
DynamicVariables=1

; ==========================================
; TITLE
; ==========================================

[TitleText]
Meter=String
X=160
Y=20
FontFace=Nothing Font (5x7)
FontSize=16
FontColor=#AccentColor#
StringAlign=Center
Text="CUSTOMIZATION"
AntiAlias=1
DynamicVariables=1

[SubtitleText]
Meter=String
X=160
Y=50
FontFace=Nothing Font (5x7)
FontSize=10
FontColor=#DarkTextColor#
StringAlign=Center
Text="Adjust colors and scale"
AntiAlias=1
DynamicVariables=1

; ==========================================
; SCALE SECTION
; ==========================================

[ScaleHeader]
Meter=String
X=20
Y=85
FontFace=Nothing Font (5x7)
FontSize=12
FontColor=#AccentColor#
Text="RESOLUTION / SCALE"
AntiAlias=1
DynamicVariables=1

[ScaleLabel]
Meter=String
X=20
Y=115
FontFace=Nothing Font (5x7)
FontSize=10
FontColor=#DarkTextColor#
Text="Global Scale (1 = 100%)"
AntiAlias=1
DynamicVariables=1

[ScaleValue]
Meter=String
X=250
Y=115
W=50
FontFace=Nothing Font (5x7)
FontSize=10
FontColor=#DarkTextColor#
StringAlign=Right
Text="#GlobalScale#"
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureInputScale "ExecuteBatch 1"]

[ScaleBtnSmall]
Meter=Shape
X=20
Y=140
Shape=Rectangle 0,0,80,30,10 | Fill Color #DarkSecondaryColor# | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables GlobalScale "0.75" "#@#GlobalVariables.inc"][!RefreshGroup "NThingUI"]
DynamicVariables=1

[ScaleBtnSmallText]
Meter=String
X=60
Y=155
FontFace=Nothing Font (5x7)
FontSize=9
FontColor=#DarkTextColor#
StringAlign=Center
Text="75%"
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!WriteKeyValue Variables GlobalScale "0.75" "#@#GlobalVariables.inc"][!RefreshGroup "NThingUI"]

[ScaleBtnNormal]
Meter=Shape
X=110
Y=140
Shape=Rectangle 0,0,80,30,10 | Fill Color #AccentColor# | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables GlobalScale "1" "#@#GlobalVariables.inc"][!RefreshGroup "NThingUI"]
DynamicVariables=1

[ScaleBtnNormalText]
Meter=String
X=150
Y=155
FontFace=Nothing Font (5x7)
FontSize=9
FontColor=#DarkTextColor#
StringAlign=Center
Text="100%"
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!WriteKeyValue Variables GlobalScale "1" "#@#GlobalVariables.inc"][!RefreshGroup "NThingUI"]

[ScaleBtnLarge]

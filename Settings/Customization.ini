[ResetBtn]
Meter=Shape
X=170
Y=490
Shape=Rectangle 0,0,100,35,10 | Fill Color #DarkSecondaryColor# | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables GlobalScale "1" "#@#GlobalVariables.inc"][!WriteKeyValue Variables AccentColor "E2201F" "#@#GlobalVariables.inc"][!WriteKeyValue Variables LightBgColor "F1F0F6" "#@#GlobalVariables.inc"][!WriteKeyValue Variables LightTextColor "1B1C1D" "#@#GlobalVariables.inc"][!WriteKeyValue Variables DarkBgColor "1B1C1D" "#@#GlobalVariables.inc"][!WriteKeyValue Variables DarkTextColor "F1F0F6" "#@#GlobalVariables.inc"][!Refresh][!RefreshGroup "NThingUI"]

; ==========================================
; INPUT MEASURES (for direct value entry)
; ==========================================

[MeasureInputScale]
Measure=Plugin
Plugin=InputText
SolidColor=303038
FontColor=#DarkTextColor#
FontFace=Nothing Font (5x7)
FontSize=10
X=200
Y=113
W=80
H=20
DefaultValue="#GlobalScale#"
Command1=[!WriteKeyValue Variables GlobalScale "$UserInput$" "#@#GlobalVariables.inc"][!Refresh][!RefreshGroup "NThingUI"]

[MeasureInputAccent]
